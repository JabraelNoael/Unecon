name: VoiceApp
options:
  bundleIdPrefix: com.jnoael.voiceapp
  deploymentTarget:
    iOS: "17.0"

targets:
  VoiceApp:
    type: application
    platform: iOS
    sources:
      - path: VoiceApp
    info:
      path: VoiceApp/Info.plist
      properties:
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "Record your voice memos."
        NSSpeechRecognitionUsageDescription: "Transcribe your voice memos on-device."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jnoael.voiceapp
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
